name: Build Android app

# The container this was scaffolded in has no Android SDK, so CI is the first
# place the native build is actually exercised. Keep it on every push to the app
# or the native project so a broken shell shows up immediately.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list still asks for "tools", a package Google
          # removed from the repository, and sdkmanager exits 1 on the miss.
          # Naming what the build actually needs sidesteps it.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - run: npm ci
      - run: npm test
      # PROXY_URL is filled in at deploy time from a repository variable, so
      # pointing the app at a server is a settings change rather than a code
      # change. Empty (unset) leaves the app exactly as it is without one.
      - name: Point the app at the translation server
        run: |
          if [ -n "${{ vars.PROXY_URL }}" ]; then
            sed -i "s|export const PROXY_URL = '';|export const PROXY_URL = '${{ vars.PROXY_URL }}';|" app/js/translate.js
            grep -n "PROXY_URL =" app/js/translate.js
          else
            echo "PROXY_URL 변수가 비어 있습니다 — 번역 서버 없이 배포합니다."
          fi

      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: k-office-english-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
