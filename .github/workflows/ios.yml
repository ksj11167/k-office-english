name: Build iOS app

# Since the repository went public, standard runners — macOS included — are free
# and unmetered, so the old reason for keeping this on workflow_dispatch (paying
# by the minute) is gone. It stays manual only because nothing about iOS changes
# on a normal push.
#
# This builds the simulator target, which needs no signing certificate. That
# proves the shell compiles; it does not produce anything installable. Shipping
# to TestFlight from here is possible without owning a Mac — App Store Connect
# API key plus fastlane — and needs the $99 Apple Developer account first.
on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm test
      - run: npx cap sync ios

      - name: Build for simulator (no signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
