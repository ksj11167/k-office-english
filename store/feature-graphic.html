.frame { position: relative; width: 1024px; height: 500px; overflow: hidden; background: var(--navy); font-family: 'Body', sans-serif; }

/* Left: the promise, white on navy. */
.copy { position: absolute; left: 60px; top: 0; bottom: 0; width: 480px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.wordmark { font-family: 'Display'; font-weight: 900; font-size: 22px; letter-spacing: -.04em; color: #ffffff; display: flex; align-items: baseline; gap: 10px; }
.wordmark small { font-family: 'Body'; font-weight: 400; font-size: 15px; letter-spacing: -.01em; color: rgba(255,255,255,.72); }
h1 { font-family: 'Display'; font-weight: 900; font-size: 45px; line-height: 1.25; letter-spacing: -.055em; color: #ffffff; white-space: nowrap; }
.copy p { font-family: 'Body'; font-weight: 400; font-size: 19px; line-height: 1.5; letter-spacing: -.02em; color: rgba(255,255,255,.78); }

/* Right: one memo on the desk, a second sheet peeking out underneath. */
.doc, .doc-back { position: absolute; width: 400px; border-radius: 18px; }
.doc-back { right: 40px; top: 70px; height: 360px; background: #d7deea; transform: rotate(3deg); box-shadow: 0 12px 30px rgba(5, 10, 25, .25); }
.doc { right: 56px; top: 50px; padding: 0 26px 22px; background: var(--sheet); transform: rotate(-2.5deg); box-shadow: 0 24px 60px rgba(5, 10, 25, .35); }
.head { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 16px; border-bottom: 1px solid var(--line); }
.head small, .row small { display: block; font-family: 'Body'; font-weight: 700; font-size: 12px; color: var(--muted); }
.head b { display: block; font-family: 'Display'; font-weight: 900; font-size: 24px; letter-spacing: -.04em; color: var(--ink); margin-top: 2px; }
.kyul { display: grid; grid-template-columns: repeat(3, 50px); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kyul > div { border-left: 1px solid var(--line); text-align: center; }
.kyul > div:first-child { border-left: 0; }
.kyul span { display: block; font-family: 'Body'; font-weight: 700; font-size: 10px; color: var(--muted); border-bottom: 1px solid var(--line); padding: 2px 0; }
.kyul i { display: grid; place-items: center; height: 40px; font-style: normal; }
.kyul i.s::before { content: "결재"; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--seal); color: var(--seal); font-family: 'Display'; font-weight: 900; font-size: 10px; transform: rotate(-8deg); }
.kyul i.s { font-size: 0; }
.row { padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
.row.last { border-bottom: 0; }
.row p { margin-top: 3px; font-family: 'Body'; font-size: 18px; color: var(--ink-2); letter-spacing: -.02em; }
.row p.en { font-family: 'Answer'; font-weight: 400; font-size: 21px; letter-spacing: 0; color: var(--ink-2); }
.row p.en.strong { font-weight: 500; color: var(--ink); font-size: 22px; }
.row p.mine { font-family: 'Body'; font-weight: 700; color: var(--mine-ink); font-size: 19px; }
.row p.mine span { background: linear-gradient(transparent 48%, var(--mine) 48%); padding: 0 3px; }

/* The seal, pressed over the corner of the sheet. */
.seal {
  position: absolute; right: -34px; bottom: -58px; width: 104px; height: 104px; border-radius: 50%;
  border: 4px solid var(--seal); color: var(--seal); display: grid; place-items: center;
  font-family: 'Display'; font-weight: 900; font-size: 27px; letter-spacing: -.02em;
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.95), inset 0 0 0 7px rgba(196, 53, 42, .5);
  background: rgba(255,255,255,.92); transform: rotate(-12deg);
}
</style>
</head>
<body>
<div class="frame">
  <div class="copy">
    <div class="wordmark">K-직장인 영어<small>업무 영어 연습</small></div>
    <h1>어제 단톡방에서 한 말,<br>영어로 결재받기</h1>
    <p>카톡 대화를 영어로 옮기고, 내가 한 말로 보고하는 연습</p>
  </div>

  <div class="doc-back" aria-hidden="true"></div>
  <div class="doc">
    <div class="head">
      <div><small>건명</small><b>진행 보고</b></div>
      <div class="kyul">
        <div><span>담당</span><i class="s">결재</i></div>
        <div><span>팀장</span><i class="s">결재</i></div>
        <div><span>본부장</span><i></i></div>
      </div>
    </div>
    <div class="row"><small>받은 말</small><p class="en">Sejin, where did that deploy end up?</p></div>
    <div class="row"><small>내 답</small><p class="mine"><span>지금 QA 돌리고 있습니다</span></p></div>
    <div class="row last"><small>영문</small><p class="en strong">I'm running QA on it right now.</p></div>
    <div class="seal">결재</div>
  </div>
</div>
</body>
</html>
