  :root {
    --accent: #2952e3;
    --accent-deep: #1c3bae;
    --surface: #ffffff;
    --surface-2: #f6f8fa;
    --ink: #171c25;
    --ink-2: #47505f;
    --muted: #79818f;
    --line: #dde1e8;
    --mine: #ffe8a3;
    --mine-ink: #4a3c10;
    --mine-line: #f0d383;
    --sans: 'Body', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .frame {
    width: 1024px; height: 500px;
    background: var(--accent-deep);
    font-family: var(--sans);
    display: grid; grid-template-columns: 1fr 470px;
    align-items: center; gap: 44px; padding: 0 60px;
    overflow: hidden; position: relative;
  }
  .arc { position: absolute; inset: 0; pointer-events: none; }

  .copy { position: relative; display: flex; flex-direction: column; gap: 18px; }
  .wordmark { display: flex; align-items: center; gap: 10px; }
  .wordmark i { width: 11px; height: 11px; border-radius: 50%; background: var(--mine); display: block; flex: none; }
  .wordmark span {
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    letter-spacing: .04em; color: #a9bdff;
  }
  h1 {
    margin: 0; color: #ffffff;
    font-family: 'Display', var(--sans);
    font-size: 56px; font-weight: 900; letter-spacing: -.035em; line-height: 1.14;
  }
  h1 em { font-style: normal; color: var(--mine); }
  p { margin: 0; color: #c7d4ff; font-size: 19px; line-height: 1.5; font-weight: 400; max-width: 20em; }

  .card {
    background: var(--surface); border-radius: 22px; padding: 26px 24px 24px;
    box-shadow: 0 18px 44px rgba(10, 20, 50, .28);
    display: flex; flex-direction: column; gap: 12px;
  }
  .tag {
    align-self: flex-start; font-size: 12.5px; font-weight: 500; letter-spacing: .04em;
    padding: 5px 12px; border-radius: 99px; background: #e6ebfd; color: var(--accent);
  }
  .bub {
    align-self: flex-start; max-width: 86%;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 18px; border-bottom-left-radius: 6px;
    padding: 12px 15px; font-size: 17px; color: var(--ink-2); line-height: 1.4; font-weight: 400;
  }
  .bub .who { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .mine {
    align-self: flex-end; max-width: 92%;
    background: var(--mine); color: var(--mine-ink); border: 1px solid var(--mine-line);
    border-radius: 18px; border-bottom-right-radius: 6px;
    padding: 14px 17px; font-size: 20px; font-weight: 600; line-height: 1.4;
  }
  .rule { border-top: 2px dashed var(--line); margin-top: 6px; padding-top: 14px; }
  .en { font-family: 'Answer', Georgia, serif; font-size: 26px; line-height: 1.25; color: var(--ink); }
</style>
</head>
<body>
<div class="frame">
  <svg class="arc" viewBox="0 0 1024 500" aria-hidden="true">
    <path d="M -40 470 C 180 390, 300 300, 360 120" fill="none"
          stroke="#2952e3" stroke-width="86" stroke-linecap="round" opacity=".55"></path>
    <path d="M 640 -40 C 760 120, 900 180, 1120 160" fill="none"
          stroke="#2952e3" stroke-width="64" stroke-linecap="round" opacity=".4"></path>
  </svg>

  <div class="copy">
    <div class="wordmark"><i></i><span>K-직장인 영어</span></div>
    <h1>어제 단톡방을<br><em>영어로</em></h1>
    <p>내가 진짜 쓴 말로 하는 영어 말하기 연습</p>
  </div>

  <div class="card">
    <span class="tag">진행 보고</span>
    <div class="bub"><span class="who">박팀장</span>그 배포 건 어떻게 됐어요?</div>
    <div class="mine">지금 QA 돌리고 있습니다</div>
    <div class="rule"><div class="en">I'm running QA on it now.</div></div>
  </div>
</div>
</body>
</html>
